<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Rail">
<meta name="theme-color" content="#0A1C14">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230B3024'/%3E%3Ctext x='90' y='122' font-family='Georgia,serif' font-size='104' fill='%23C9A961' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<title>The Rail</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{margin:0;background:#0A1C14;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .animate-spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useEffect, useMemo, useRef } = React;
const Ico = (d, extra) => ({ size = 16, className = "", style = {} }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
       className={className} style={style} aria-hidden="true">{d}{extra}</svg>
);
const ChevronUp    = Ico(<polyline points="18 15 12 9 6 15" />);
const ChevronDown  = Ico(<polyline points="6 9 12 15 18 9" />);
const Plus         = Ico(<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>);
const Check        = Ico(<polyline points="20 6 9 17 4 12" />);
const ArrowLeft    = Ico(<><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>);
const Trash2       = Ico(<><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></>);
const X            = Ico(<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>);
const Loader2      = Ico(<path d="M21 12a9 9 0 1 1-6.2-8.5" />);
const AlertTriangle= Ico(<><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>);
const Download     = Ico(<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>);
const Undo2        = Ico(<><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></>);


const STAGES = ["Idea", "Filmed", "Assembled", "Voiceover", "Edited", "Exported", "Copy Written", "Ready", "Published"];
const CATS = ["Menswear", "Gastronomy", "Travel"];
const PLATFORMS = ["instagram", "youtube", "tiktok", "facebook"];
const PLABEL = { instagram: "Instagram", youtube: "YouTube", tiktok: "TikTok", facebook: "Facebook" };
const KEY = "mos:rail:v2";
const C = { ink: "#0A1C14", deep: "#0B3024", green: "#14402F", gold: "#C9A961", cream: "#F3EBDC", ivory: "#EDE4D0", warn: "#C4623F" };

const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmtD = (d) => `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
const fmtT = (d) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const atHM = (d, h, m) => { const x = new Date(d); x.setHours(h, m, 0, 0); return x; };
const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };

const TikTokMark = ({ size = 15 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 0 1-2.59 2.5 2.59 2.59 0 1 1 .77-5.06V9.7a5.68 5.68 0 0 0-.77-.05A5.66 5.66 0 1 0 15.54 15.3V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3a4.29 4.29 0 0 1-3.24-1.48z" />
  </svg>
);
const IGMark = ({ size = 15 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
    <rect x="2" y="2" width="20" height="20" rx="5" /><circle cx="12" cy="12" r="4" /><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none" />
  </svg>
);
const YTMark = ({ size = 15 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
    <rect x="2" y="5" width="20" height="14" rx="4" /><path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none" />
  </svg>
);
const FBMark = ({ size = 15 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
    <path d="M14 8.5V7a1.5 1.5 0 0 1 1.5-1.5H17V2.5h-2.5A4.5 4.5 0 0 0 10 7v1.5H7.5V12H10v9.5h4V12h2.6l.4-3.5z" />
  </svg>
);
const Mark = ({ p, size }) => ({ instagram: <IGMark size={size} />, youtube: <YTMark size={size} />, tiktok: <TikTokMark size={size} />, facebook: <FBMark size={size} /> }[p]);

const blank = (over = {}) => ({
  id: Date.now() + Math.floor(Math.random() * 999), title: "", category: "Menswear", slot: "Primary",
  format: "Video", stage: "Idea", vo: false, notes: "", where: "parked", igISO: null,
  posts: Object.fromEntries(PLATFORMS.map((p) => [p, { done: false, at: null, skip: false }])), ...over,
});

const SEED = [
  blank({ id: 1, title: "Mott 32, Hong Kong", category: "Gastronomy", slot: "Primary", stage: "Exported", where: "rail", notes: "Gastronomy in the Thursday slot this week only." }),
  blank({ id: 2, title: "Gaziano & Girling — shoe one", category: "Menswear", slot: "Secondary", stage: "Idea", where: "rail", notes: "Per-shoe series, not a collection showcase — avoids the accumulation read." }),
  blank({ id: 3, title: "Double-breasted GRWM — pinstripe", stage: "Filmed", where: "rail" }),
  blank({ id: 4, title: "Duke's Bar", category: "Gastronomy", slot: "Secondary", stage: "Filmed", vo: true, where: "rail", notes: "Voiceover flagship." }),
  blank({ id: 5, title: "Double-breasted GRWM — grey", stage: "Filmed", where: "rail" }),
  blank({ id: 6, title: "Double-breasted GRWM — herringbone", stage: "Filmed", where: "rail" }),
  blank({ id: 7, title: "Grey suit GRWM — Shibumi braces", stage: "Filmed", notes: "Format undecided. Arrival of an object, or post-GRWM appreciation — not an unboxing." }),
  blank({ id: 8, title: "Summer season retrospective", stage: "Idea", vo: true, notes: "Caledonian, Versailles, Ascot, Henley. May warrant the first long-form landscape piece." }),
  blank({ id: 9, title: "White tie dinner, Brinkley's", stage: "Idea", notes: "Filming 4 Sep — b-roll for the autumn arc." }),
  blank({ id: 10, title: "Black tie — the history", stage: "Idea", vo: true, notes: "Autumn arc." }),
  blank({ id: 11, title: "White tie — the history", stage: "Idea", vo: true, notes: "Autumn arc." }),
  blank({ id: 12, title: "Savile Row — the history", stage: "Idea", vo: true, notes: "Evergreen strand." }),
  blank({ id: 13, title: "Qatar Airways Business Class", category: "Travel", slot: "Secondary", stage: "Filmed", notes: "Travel channel, or a Trial Reel to test resonance." }),
];

/* Primary takes Thursdays, Secondary takes Tuesdays, in rail order.
   An asset whose Instagram post is already out keeps its frozen date. */
function schedule(rail) {
  const out = new Map();
  const live = [], pend = { Primary: [], Secondary: [] };
  rail.forEach((a) => (a.igISO ? live.push(a) : pend[a.slot].push(a)));
  live.forEach((a) => out.set(a.id, new Date(a.igISO)));
  const taken = new Set(live.map((a) => startOfDay(new Date(a.igISO)).getTime()));
  let i = { Primary: 0, Secondary: 0 };
  const cur = startOfDay(new Date());
  cur.setDate(cur.getDate() + 1);
  for (let g = 0; g < 300 && (i.Primary < pend.Primary.length || i.Secondary < pend.Secondary.length); g++) {
    const dow = cur.getDay();
    const kind = dow === 4 ? "Primary" : dow === 2 ? "Secondary" : null;
    if (kind && i[kind] < pend[kind].length && !taken.has(cur.getTime())) {
      out.set(pend[kind][i[kind]++].id, atHM(cur, 18, 0));
    }
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}

const platformDate = (ig, p) => {
  if (!ig) return null;
  if (p === "instagram") return atHM(ig, 18, 0);
  if (p === "youtube") return atHM(addD(ig, 1), 16, 0);
  if (p === "tiktok") return atHM(addD(ig, 2), 10, 0);
  const f = addD(ig, 3);
  return atHM(f, f.getDay() === 0 ? 11 : 13, 0);
};

function TheRail() {
  const [items, setItems] = useState(null);
  const [tab, setTab] = useState("rail");
  const [parkedSort, setParkedSort] = useState("stage");
  const [open, setOpen] = useState(null);
  const [adding, setAdding] = useState(false);
  const [draft, setDraft] = useState({ title: "", category: "Menswear", slot: "Primary", format: "Video" });
  const [confirm, setConfirm] = useState(null);
  const [exporting, setExporting] = useState(false);
  const [busy, setBusy] = useState(false);
  const [undo, setUndo] = useState(null);
  const taRef = useRef(null);

  useEffect(() => {
    (async () => {
      try { const r = localStorage.getItem(KEY); setItems(r ? JSON.parse(r) : SEED); }
      catch { setItems(SEED); }
    })();
  }, []);

  const save = async (next) => {
    setItems(next); setBusy(true);
    try { localStorage.setItem(KEY, JSON.stringify(next)); } catch (e) { console.error(e); }
    setBusy(false);
  };
  const patch = (id, f) => save(items.map((a) => (a.id === id ? { ...a, ...f } : a)));

  const rail = useMemo(() => (items || []).filter((a) => a.where === "rail"), [items]);
  const parked = useMemo(() => {
    const list = (items || []).filter((a) => a.where === "parked");
    if (parkedSort === "manual") return list;
    return [...list].sort((x, y) => {
      const d = STAGES.indexOf(y.stage) - STAGES.indexOf(x.stage);
      return d !== 0 ? d : x.title.localeCompare(y.title);
    });
  }, [items, parkedSort]);
  const sched = useMemo(() => schedule(rail), [rail]);

  const active = (a) => PLATFORMS.filter((p) => !a.posts[p].skip);
  const allOut = (a) => active(a).every((p) => a.posts[p].done);

  const uploads = useMemo(() => {
    const list = [];
    rail.forEach((a) => {
      const ig = sched.get(a.id); if (!ig) return;
      active(a).forEach((p) => { if (!a.posts[p].done) list.push({ a, p, when: platformDate(ig, p) }); });
    });
    return list.sort((x, y) => x.when - y.when);
  }, [rail, sched]);

  const out = useMemo(() => (items || []).filter((a) => a.where === "out")
    .sort((x, y) => new Date(y.posts.facebook.at || y.igISO || 0) - new Date(x.posts.facebook.at || x.igISO || 0)), [items]);

  const tick = (a, p) => {
    const now = new Date();
    const posts = { ...a.posts, [p]: { done: true, at: now.toISOString(), skip: false } };
    const next = { ...a, posts };
    if (p === "instagram" && !a.igISO) next.igISO = (sched.get(a.id) || now).toISOString();
    if (PLATFORMS.filter((q) => !posts[q].skip).every((q) => posts[q].done)) { next.where = "out"; next.stage = "Published"; }
    setUndo({ id: a.id, snapshot: a });
    save(items.map((x) => (x.id === a.id ? next : x)));
  };

  const undoLast = () => { if (!undo) return; save(items.map((x) => (x.id === undo.id ? undo.snapshot : x))); setUndo(null); };

  const move = (id, dir) => {
    const list = [...items];
    const me = list.find((a) => a.id === id);
    const peers = list.map((a, i) => (me.where === "parked"
      ? (a.where === "parked" ? i : -1)
      : (a.where === "rail" && a.slot === me.slot && !a.igISO ? i : -1))).filter((i) => i >= 0);
    const i = list.findIndex((a) => a.id === id);
    const target = peers[peers.indexOf(i) + dir];
    if (target === undefined) return;
    [list[i], list[target]] = [list[target], list[i]];
    save(list);
  };

  const step = (a, dir) => {
    let n = STAGES.indexOf(a.stage) + dir;
    if (STAGES[n] === "Voiceover" && !a.vo) n += dir;
    patch(a.id, { stage: STAGES[Math.max(0, Math.min(n, STAGES.length - 1))] });
  };

  const add = () => {
    if (!draft.title.trim()) return;
    save([...items, blank({ ...draft, title: draft.title.trim() })]);
    setDraft({ title: "", category: "Menswear", slot: "Primary", format: "Video" });
    setAdding(false); setTab("parked");
  };

  const exportText = () => (items || []).map((a) => {
    const ig = sched.get(a.id);
    const rows = PLATFORMS.map((p) => `    ${PLABEL[p]}: ${a.posts[p].skip ? "skipped" : a.posts[p].done ? `posted ${a.posts[p].at ? fmtD(new Date(a.posts[p].at)) : "—"}` : ig ? `${fmtD(platformDate(ig, p))} ${fmtT(platformDate(ig, p))}` : "unscheduled"}`).join("\n");
    return `${a.title}\n  ${a.category} · ${a.slot} · ${a.format} · ${a.stage}${a.vo ? " · VO" : ""} · ${a.where}\n${a.notes ? `  Notes: ${a.notes}\n` : ""}${rows}`;
  }).join("\n\n");

  if (!items) return <div className="min-h-screen flex items-center justify-center" style={{ background: C.ink }}><Loader2 className="animate-spin" size={22} style={{ color: C.gold }} /></div>;

  const now = new Date();
  const list = tab === "rail" ? rail : tab === "parked" ? parked : out;
  const head = uploads[0];
  const overdue = uploads.filter((u) => u.when < now);
  const upcoming = uploads.slice(head ? 1 : 0, (head ? 1 : 0) + 5);

  const notReady = (a) => {
    const ig = sched.get(a.id); if (!ig || a.igISO) return false;
    return (ig - now) / 864e5 <= 3 && STAGES.indexOf(a.stage) < STAGES.indexOf("Ready");
  };

  return (
    <div className="min-h-screen pb-28" style={{ background: C.ink, color: C.cream }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@400;500;600&display=swap');
        .disp{font-family:'Bodoni Moda',serif}.bd{font-family:'Cormorant Garamond',serif}
        .ut{font-family:'Montserrat',sans-serif;letter-spacing:.09em;text-transform:uppercase}
        button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid ${C.gold};outline-offset:2px}
        select{-webkit-appearance:none;appearance:none}
        @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}`}</style>

      {/* ── NEXT OUT ─────────────────────────────── */}
      <header className="px-5 pt-7 pb-5" style={{ borderBottom: `1px solid ${C.green}` }}>
        <div className="flex justify-between items-start">
          <div>
            <div className="ut text-[9px]" style={{ color: C.gold }}>Man of Stature</div>
            <h1 className="disp text-3xl mt-0.5">The Rail</h1>
          </div>
          <div className="flex items-center gap-2 mt-1">
            {busy && <Loader2 className="animate-spin" size={14} style={{ color: C.gold }} />}
            <button onClick={() => setExporting(true)} aria-label="Export everything" className="p-1.5"><Download size={17} style={{ color: C.gold }} /></button>
          </div>
        </div>

        {head ? (
          <div className="mt-4 rounded" style={{ background: C.green, borderLeft: `3px solid ${head.when < now ? C.warn : C.gold}` }}>
            <div className="p-3.5">
              <div className="flex justify-between items-center">
                <span className="ut text-[9px]" style={{ color: head.when < now ? C.warn : C.gold }}>
                  {head.when < now ? `Overdue · ${overdue.length} waiting` : "Next out"} · {head.a.slot}
                </span>
                <span className="ut text-[9px]" style={{ color: C.ivory, opacity: .7 }}>{head.a.format}</span>
              </div>
              <div className="flex items-center gap-2.5 mt-2.5">
                <span style={{ color: C.gold }}><Mark p={head.p} size={19} /></span>
                <span className="bd text-xl leading-tight">{head.a.title}</span>
              </div>
              <div className="flex justify-between items-end mt-2.5">
                <div className="ut text-[9px]" style={{ color: C.ivory, opacity: .8 }}>
                  {fmtD(head.when)} · {fmtT(head.when)}<br />
                  <span style={{ opacity: .75 }}>{head.a.stage}{head.a.vo ? " · VO" : ""}</span>
                </div>
                <button onClick={() => tick(head.a, head.p)} className="ut text-[10px] px-4 py-2.5 rounded" style={{ background: C.gold, color: C.ink }}>Uploaded</button>
              </div>
            </div>
          </div>
        ) : (
          <p className="bd text-lg mt-4" style={{ opacity: .6 }}>Nothing scheduled. Put something on the rail.</p>
        )}

        {upcoming.length > 0 && (
          <div className="mt-3.5 space-y-0">
            {upcoming.map((u, i) => (
              <div key={i} className="flex items-center gap-2.5 py-2" style={{ borderBottom: `1px solid rgba(201,169,97,.13)` }}>
                <span className="ut text-[9px] shrink-0" style={{ color: u.when < now ? C.warn : C.ivory, opacity: u.when < now ? 1 : .65, width: 92 }}>
                  {fmtD(u.when)} {fmtT(u.when)}
                </span>
                <span className="shrink-0" style={{ color: C.gold }}><Mark p={u.p} size={13} /></span>
                <span className="bd text-base truncate" style={{ opacity: .9 }}>{u.a.title}</span>
              </div>
            ))}
          </div>
        )}

        {undo && (
          <button onClick={undoLast} className="ut text-[9px] mt-3 flex items-center gap-1.5" style={{ color: C.gold }}>
            <Undo2 size={12} /> Undo last upload
          </button>
        )}
      </header>

      {/* ── TABS ─────────────────────────────── */}
      <nav className="flex px-5 gap-1 pt-4">
        {[["rail", `On the Rail ${rail.length}`], ["parked", `Parked ${parked.length}`], ["out", `Out ${out.length}`]].map(([k, l]) => (
          <button key={k} onClick={() => { setTab(k); setOpen(null); }} className="ut text-[9px] px-3 py-2 rounded-t"
            style={{ background: tab === k ? C.green : "transparent", color: tab === k ? C.gold : C.ivory, opacity: tab === k ? 1 : .5 }}>{l}</button>
        ))}
      </nav>

      {/* ── CARDS ─────────────────────────────── */}
      <main className="px-5 pt-3 space-y-2.5">
        {tab === "parked" && parked.length > 1 && (
          <button onClick={() => setParkedSort(parkedSort === "stage" ? "manual" : "stage")}
            className="ut text-[9px] pb-1" style={{ color: C.gold }}>
            {parkedSort === "stage" ? "Sorted by stage — tap to rearrange" : "Rearranging — tap to sort by stage"}
          </button>
        )}
        {list.length === 0 && <p className="bd text-lg py-10 text-center" style={{ opacity: .55 }}>
          {tab === "parked" ? "No ideas parked. Add one below." : tab === "rail" ? "The rail is empty. Move something across from Parked." : "Nothing fully published yet."}
        </p>}

        {list.map((a) => {
          const ig = sched.get(a.id), isOpen = open === a.id, si = STAGES.indexOf(a.stage), warn = notReady(a);
          return (
            <article key={a.id} className="rounded overflow-hidden" style={{ background: C.deep, border: `1px solid ${warn ? "rgba(196,98,63,.5)" : C.green}` }}>
              <div className="flex">
                {((tab === "rail" && !a.igISO) || (tab === "parked" && parkedSort === "manual")) && (
                  <div className="flex flex-col justify-center gap-0.5 px-1" style={{ background: C.ink }}>
                    <button onClick={() => move(a.id, -1)} aria-label="Earlier" className="p-2"><ChevronUp size={15} style={{ color: C.gold }} /></button>
                    <button onClick={() => move(a.id, 1)} aria-label="Later" className="p-2"><ChevronDown size={15} style={{ color: C.gold }} /></button>
                  </div>
                )}
                <button onClick={() => setOpen(isOpen ? null : a.id)} className="flex-1 text-left px-3.5 py-3 min-w-0">
                  <div className="flex justify-between items-baseline gap-2">
                    <span className="ut text-[9px] truncate" style={{ color: C.gold }}>{a.category}{tab !== "out" && ` · ${a.slot}`} · {a.format}</span>
                    {ig && <span className="ut text-[9px] shrink-0" style={{ color: C.ivory, opacity: .65 }}>{fmtD(ig)}</span>}
                  </div>
                  <h2 className="bd text-xl leading-snug mt-1">{a.title}</h2>
                  {tab !== "out" && (
                    <>
                      <div className="flex gap-0.5 mt-2.5">
                        {STAGES.map((s, i) => <span key={s} className="h-[3px] flex-1 rounded-full" style={{ background: i <= si ? C.gold : "rgba(255,255,255,.13)" }} />)}
                      </div>
                      <div className="ut text-[9px] mt-1.5 flex items-center gap-1.5" style={{ color: warn ? C.warn : C.ivory, opacity: warn ? 1 : .7 }}>
                        {warn && <AlertTriangle size={11} />}{a.stage}{a.vo ? " · VO" : ""}{warn && " · due soon"}
                      </div>
                    </>
                  )}
                  {tab === "rail" && (
                    <div className="flex gap-2 mt-2">
                      {PLATFORMS.map((p) => (
                        <span key={p} style={{ color: a.posts[p].skip ? "rgba(255,255,255,.15)" : a.posts[p].done ? C.gold : "rgba(237,228,208,.35)" }}><Mark p={p} size={13} /></span>
                      ))}
                    </div>
                  )}
                </button>
              </div>

              {isOpen && (
                <div className="px-3.5 pb-4 space-y-3.5" style={{ borderTop: `1px solid ${C.ink}` }}>
                  <input value={a.title} onChange={(e) => patch(a.id, { title: e.target.value })} aria-label="Working title"
                    className="w-full bd text-lg px-2.5 py-2 rounded mt-3" style={{ background: C.green, color: C.cream, border: `1px solid rgba(201,169,97,.25)` }} />
                  <textarea value={a.notes} onChange={(e) => patch(a.id, { notes: e.target.value })} placeholder="Notes on the project" rows={3} aria-label="Notes"
                    className="w-full bd text-base px-2.5 py-2 rounded" style={{ background: C.green, color: C.cream, border: `1px solid rgba(201,169,97,.25)` }} />

                  {ig && (
                    <div>
                      {PLATFORMS.map((p) => {
                        const s = a.posts[p], when = platformDate(ig, p);
                        return (
                          <div key={p} className="flex items-center gap-2 py-1.5" style={{ borderBottom: `1px solid rgba(201,169,97,.12)` }}>
                            <span style={{ color: s.done ? C.gold : s.skip ? "rgba(255,255,255,.2)" : C.ivory, opacity: s.skip ? 1 : .8 }}><Mark p={p} size={13} /></span>
                            <span className="ut text-[9px] flex-1" style={{ color: s.done ? C.gold : C.ivory, opacity: s.skip ? .3 : .85, textDecoration: s.done || s.skip ? "line-through" : "none" }}>{PLABEL[p]}</span>
                            <span className="ut text-[9px]" style={{ color: C.ivory, opacity: s.skip ? .3 : .7, textDecoration: s.done || s.skip ? "line-through" : "none" }}>
                              {s.done && s.at ? fmtD(new Date(s.at)) : `${fmtD(when)} ${fmtT(when)}`}
                            </span>
                            {tab === "rail" && !s.done && (
                              <button onClick={() => patch(a.id, { posts: { ...a.posts, [p]: { ...s, skip: !s.skip } } })}
                                className="ut text-[8px] px-1.5 py-1 rounded" style={{ border: `1px solid rgba(237,228,208,.25)`, color: C.ivory, opacity: .6 }}>
                                {s.skip ? "add" : "skip"}
                              </button>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {tab !== "out" && (
                    <div className="flex items-center gap-2">
                      <button onClick={() => step(a, -1)} disabled={si === 0} aria-label="Previous stage"
                        className="p-2.5 rounded" style={{ border: `1px solid rgba(237,228,208,.28)`, color: C.ivory, opacity: si === 0 ? .25 : 1 }}><ArrowLeft size={14} /></button>
                      <select value={a.stage} onChange={(e) => patch(a.id, { stage: e.target.value })} aria-label="Stage"
                        className="ut text-[9px] flex-1 px-2.5 py-2.5 rounded text-center" style={{ background: C.green, color: C.cream, border: `1px solid rgba(201,169,97,.25)` }}>
                        {STAGES.map((s) => <option key={s} value={s} style={{ background: C.deep }}>{s}</option>)}
                      </select>
                      <button onClick={() => step(a, 1)} disabled={si === STAGES.length - 1} aria-label="Next stage"
                        className="p-2.5 rounded" style={{ background: C.gold, color: C.ink, opacity: si === STAGES.length - 1 ? .3 : 1 }}><Check size={14} /></button>
                    </div>
                  )}

                  <div className="flex flex-wrap gap-2">
                    {tab !== "out" && (
                      <>
                        <button onClick={() => patch(a.id, { where: a.where === "rail" ? "parked" : "rail" })}
                          className="ut text-[9px] px-3 py-2 rounded" style={{ border: `1px solid ${C.gold}`, color: C.gold }}>
                          {a.where === "rail" ? "Park it" : "Put on rail"}
                        </button>
                        <button onClick={() => patch(a.id, { slot: a.slot === "Primary" ? "Secondary" : "Primary" })}
                          className="ut text-[9px] px-3 py-2 rounded" style={{ border: `1px solid rgba(237,228,208,.28)`, color: C.ivory }}>{a.slot}</button>
                        <button onClick={() => patch(a.id, { format: a.format === "Video" ? "Carousel" : "Video" })}
                          className="ut text-[9px] px-3 py-2 rounded" style={{ border: `1px solid rgba(237,228,208,.28)`, color: C.ivory }}>{a.format}</button>
                        <button onClick={() => patch(a.id, { vo: !a.vo })}
                          className="ut text-[9px] px-3 py-2 rounded" style={{ border: `1px solid rgba(237,228,208,.28)`, color: a.vo ? C.gold : C.ivory }}>VO {a.vo ? "on" : "off"}</button>
                      </>
                    )}
                    <button onClick={() => setConfirm(a)} aria-label="Delete" className="ut text-[9px] px-3 py-2 rounded flex items-center gap-1.5"
                      style={{ border: `1px solid rgba(196,98,63,.5)`, color: C.warn }}><Trash2 size={12} /> Delete</button>
                  </div>
                </div>
              )}
            </article>
          );
        })}
      </main>

      {/* ── ADD ─────────────────────────────── */}
      {adding ? (
        <div className="fixed inset-x-0 bottom-0 p-5 space-y-3 z-20" style={{ background: C.deep, borderTop: `1px solid ${C.gold}` }}>
          <div className="flex justify-between items-center">
            <span className="ut text-[10px]" style={{ color: C.gold }}>New idea</span>
            <button onClick={() => setAdding(false)} aria-label="Close"><X size={18} style={{ color: C.ivory }} /></button>
          </div>
          <input autoFocus value={draft.title} onChange={(e) => setDraft({ ...draft, title: e.target.value })} onKeyDown={(e) => e.key === "Enter" && add()}
            placeholder="What is it?" className="w-full bd text-lg px-3 py-2.5 rounded" style={{ background: C.green, color: C.cream, border: `1px solid rgba(201,169,97,.3)` }} />
          <div className="flex gap-1.5">
            {CATS.map((c) => (
              <button key={c} onClick={() => setDraft({ ...draft, category: c, slot: c === "Menswear" ? "Primary" : "Secondary" })}
                className="ut text-[8px] px-2 py-2 rounded flex-1" style={{ background: draft.category === c ? C.gold : "transparent", color: draft.category === c ? C.ink : C.ivory, border: `1px solid rgba(201,169,97,.3)` }}>{c}</button>
            ))}
          </div>
          <div className="flex gap-1.5">
            {["Primary", "Secondary"].map((s) => (
              <button key={s} onClick={() => setDraft({ ...draft, slot: s })} className="ut text-[8px] px-2 py-2 rounded flex-1"
                style={{ background: draft.slot === s ? C.gold : "transparent", color: draft.slot === s ? C.ink : C.ivory, border: `1px solid rgba(201,169,97,.3)` }}>{s}</button>
            ))}
            {["Video", "Carousel"].map((f) => (
              <button key={f} onClick={() => setDraft({ ...draft, format: f })} className="ut text-[8px] px-2 py-2 rounded flex-1"
                style={{ background: draft.format === f ? C.gold : "transparent", color: draft.format === f ? C.ink : C.ivory, border: `1px solid rgba(201,169,97,.3)` }}>{f}</button>
            ))}
          </div>
          <button onClick={add} className="w-full ut text-[10px] py-3 rounded" style={{ background: C.gold, color: C.ink }}>Add to parked</button>
        </div>
      ) : (
        <button onClick={() => setAdding(true)} aria-label="Add an idea" className="fixed bottom-6 right-5 w-14 h-14 rounded-full flex items-center justify-center shadow-lg z-20" style={{ background: C.gold, color: C.ink }}>
          <Plus size={24} />
        </button>
      )}

      {/* ── DELETE CONFIRM ─────────────────────────────── */}
      {confirm && (
        <div className="fixed inset-0 flex items-center justify-center p-6 z-30" style={{ background: "rgba(10,28,20,.9)" }}>
          <div className="rounded p-5 w-full max-w-sm" style={{ background: C.deep, border: `1px solid ${C.gold}` }}>
            <p className="bd text-lg">Delete “{confirm.title}”?</p>
            <p className="ut text-[9px] mt-2" style={{ color: C.ivory, opacity: .6 }}>This cannot be undone.</p>
            <div className="flex gap-2 mt-4">
              <button onClick={() => setConfirm(null)} className="ut text-[9px] flex-1 py-2.5 rounded" style={{ border: `1px solid rgba(237,228,208,.3)`, color: C.ivory }}>Keep it</button>
              <button onClick={() => { save(items.filter((x) => x.id !== confirm.id)); setConfirm(null); setOpen(null); }}
                className="ut text-[9px] flex-1 py-2.5 rounded" style={{ background: C.warn, color: C.cream }}>Delete</button>
            </div>
          </div>
        </div>
      )}

      {/* ── EXPORT ─────────────────────────────── */}
      {exporting && (
        <div className="fixed inset-0 p-5 z-30 flex flex-col" style={{ background: "rgba(10,28,20,.96)" }}>
          <div className="flex justify-between items-center mb-3">
            <span className="ut text-[10px]" style={{ color: C.gold }}>Everything, as text</span>
            <button onClick={() => setExporting(false)} aria-label="Close"><X size={20} style={{ color: C.ivory }} /></button>
          </div>
          <textarea ref={taRef} readOnly value={exportText()} onFocus={(e) => e.target.select()}
            className="flex-1 w-full text-xs p-3 rounded font-mono" style={{ background: C.deep, color: C.cream, border: `1px solid ${C.green}` }} />
          <button onClick={() => { taRef.current?.select(); try { document.execCommand("copy"); } catch { } }}
            className="ut text-[10px] py-3 rounded mt-3" style={{ background: C.gold, color: C.ink }}>Select all and copy</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TheRail />);
</script>
</body>
</html>
